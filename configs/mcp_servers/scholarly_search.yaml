# Scholarly Search - search for articles on arxiv and google scholar (but cannot download full text)
# Source: https://github.com/adityak74/mcp-scholarly
# Toolathlon Version: https://github.com/lockon-n/mcp-scholarly
type: stdio
name: scholarly
params:
  command: uvx
  args:
    # mcp-scholarly does not pin its dependencies; current PyPI resolutions
    # break it two ways: bibtexparser 2.x dropped bibtexparser.bibdatabase
    # (import crash via scholarly), and mcp 2.x removed the legacy
    # Server.list_tools API the package still uses.
    - "--with"
    - "bibtexparser<2"
    - "--with"
    - "mcp<2"
    - "mcp-scholarly"
  # env:
  #   HTTPS_PROXY: "${config.proxy}"
  #   HTTP_PROXY: "${config.proxy}"
  cwd: "${agent_workspace}"
client_session_timeout_seconds: 30
cache_tools_list: true